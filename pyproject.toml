[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-agentforge"
version = "0.1.0"
description = "The first Arabic-native multi-agent AI framework for enterprise"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ali Alshanaa" }]
keywords = ["arabic", "nlp", "agents", "llm", "erp", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "litellm>=1.50.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
examples = [
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ali-alshanaa/arabic-agentforge"
Issues = "https://github.com/ali-alshanaa/arabic-agentforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["arabic_agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
